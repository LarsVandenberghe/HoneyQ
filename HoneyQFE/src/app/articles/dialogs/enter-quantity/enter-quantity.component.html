<div class="modal-header">
	<h4 class="modal-title" id="modal-basic-title">Toevoegen aan winkelmand</h4>
	<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</div>

<div class="modal-body">
    <div class="card-img-top d-flex justify-content-center">
        <img [src]="article()?.imageUrl" class="m-3" style="max-width: 250px;" alt="...">
    </div>

	<div class="d-flex align-items-center justify-content-between">
		<h5 class="card-title">{{article()?.name}}</h5>
		<!-- <p class="card-text" style="font-weight: bolder">€ {{article()?.priceInEUR | number:'1.2-2':'nl-BE'}}</p> -->
	</div>

	<div class="d-flex gap-3">
		<div class="flex-grow-1 w-100">
			<h6>Voorraad</h6>
			<ngb-progressbar class="mb-3 mt-3" type="secondary" [value]="availableStock()" [striped]="true" [animated]="true"
				><i>{{availableStockLabel()}}</i></ngb-progressbar
			>
		</div>
		<form class="flex-grow-0" style="width: 220px;">

			<div class="mb-3">
				<h6>Aantal</h6>
				<div class="input-group">
					<button class="btn btn-outline-primary" (click)="onAmountChange(amount() - 1)" type="button"><fa-icon [icon]="faMinus" /></button>
					<input
						type="number"
						class="form-control"
						[ngModel]="amount()"
						(ngModelChange)=onAmountChange($event)
						[ngModelOptions]="{standalone: true}"
					/>
					<button class="btn btn-outline-primary" (click)="onAmountChange(amount() + 1)" type="button"><fa-icon [icon]="faPlus" /></button>
				</div>
			</div>
		</form>
	</div>
	<div class="d-flex align-items-center justify-content-between">
		<h6>Prijs berekening</h6>
		<p class="text-"  style="font-weight: bolder; font-size: 1.6rem">
			{{priceCalculation()}}
		</p>
	</div>



</div>
<div class="modal-footer">
	<button type="button" class="btn btn-outline-danger" (click)="modal.dismiss(modalDismissReasons.ESC)">
		<fa-icon [icon]="faClose" /> Annuleren
	</button>
	<button type="button" class="btn btn-outline-secondary" (click)="modal.close({response: enterQuantityResponses.ADD, value: amount()})">
		<fa-icon [icon]="faCheck" /> Toepassen
	</button>
	<button type="button" class="btn btn-primary" (click)="modal.close({response: enterQuantityResponses.ADD_AND_GO_TO_CART, value: amount()})">
		<fa-icon [icon]="faBasketShopping" /> Naar winkelmand
	</button>
</div>
