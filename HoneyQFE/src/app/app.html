<div>
  @if(validToken()){
    <app-header (onLogout)="logout()" (onOpenCart)="openCart(cart)" [profile]="profile()"></app-header>
  }
</div>
<div class="container">
  <router-outlet></router-outlet>
</div>
<app-toasts></app-toasts>

<ng-template #cart let-offcanvas>
	<div class="offcanvas-header">
		<h4 class="offcanvas-title">Winkelmand</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss('Cross click')"></button>
	</div>
	<div class="offcanvas-body">
		<p>One fine body&hellip;</p>
		<div class="text-end">
			<button type="button" class="btn btn-outline-secondary" (click)="offcanvas.close('Close click')">Close</button>
		</div>
	</div>
</ng-template>
