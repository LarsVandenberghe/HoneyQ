<div  class="flex">

  @if(!profile()){
    <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded" (click)="signIn()">
      <div class="flex">
        Sign in
      </div>
    </button>
  } @else {
    <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded" (click)="logout()">
      <div class="flex">
        Logout
      </div>
    </button>
  }


  <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded" (click)="callArticle()">Get data</button>
  {{article()}}
</div>
